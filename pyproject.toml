[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demtools"
version = "0.19.1"
authors = [
    { name = "aaronchh", email = "aaronhsu219@gmail.com" },
]
description = "A collection of tools for working with DEM (Digital Elevation Model) raster files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/AaronOET/demtools"

[tool.setuptools]
packages = ["demtools"]

[project.scripts]
demtools = "demtools.cli:main"
demtools-info = "demtools.describe:main"
asproj = "demtools.asproj:main"
chgnodata = "demtools.chgnodata:main"
chkdem = "demtools.chkdem:main"
deminfo = "demtools.chkdem:main"
defnodata = "demtools.defnodata:main"
mat2tif = "demtools.mat2tif:main"
tif2mat = "demtools.tif2mat:main"
tif2xyz = "demtools.tif2xyz:main"
xyz2mat = "demtools.xyz2mat:main"
xyz2tif = "demtools.xyz2tif:main"
mvdem = "demtools.mvdem:main"
demmask = "demtools.demmask:main"
demext = "demtools.demext:main"
flipbath = "demtools.flipbath:main"
